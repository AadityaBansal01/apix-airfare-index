# The index basket. Everything the index engine needs to be reproducible is here
# and is stamped into the database alongside each published index value.

index_reference:
  base_value: 100
  # 28-day price reference period. Base prices are the geometric mean of daily
  # prices over this window, so the index equals exactly 100 here by construction.
  price_ref_start: 2026-07-01
  price_ref_end:   2026-07-28

weight_reference:
  # DGCA monthly city-pair passenger traffic, both directions, rolling 12 months.
  start: 2025-06-01
  end:   2026-05-31
  source: "DGCA monthly domestic city-pair statistics"
  source_dataset: data/reference/dgca_city_pair_monthly.csv
  licence: ODbL-1.0
  attribution: "Directorate General of Civil Aviation; Ministry of Civil Aviation"

routes:
  - code: BLR-DEL
    origin: BLR
    destination: DEL
    passengers: 4879073
    weight: 0.2072001
  - code: BOM-DEL
    origin: BOM
    destination: DEL
    passengers: 3751418
    weight: 0.1593118
  - code: DEL-HYD
    origin: DEL
    destination: HYD
    passengers: 3095780
    weight: 0.1314687
  - code: CCU-DEL
    origin: CCU
    destination: DEL
    passengers: 2866361
    weight: 0.1217260
  - code: BLR-BOM
    origin: BLR
    destination: BOM
    passengers: 2310386
    weight: 0.0981153
  - code: BLR-HYD
    origin: BLR
    destination: HYD
    passengers: 2251473
    weight: 0.0956135
  - code: DEL-MAA
    origin: DEL
    destination: MAA
    passengers: 2221545
    weight: 0.0943425
  - code: BLR-CCU
    origin: BLR
    destination: CCU
    passengers: 2171615
    weight: 0.0922221

# BASKET REVIEW, 2026-09-08. Two sectors added.
#
# DEL-HYD (3,095,780 pax) carried more traffic than three routes that were
# already in the basket, and BLR-CCU (2,171,615) more than none of them by much.
# Both were absent only because the problem statement seeded six routes and
# nobody had revisited the list. Adding them raises coverage of traffic among
# the six metros from 56.3% to 72.5%.
#
# The weights are NOT hand-edited here. They are regenerated by
# `make weights`, which reads DGCA city-pair traffic and assigns the rounding
# residual by largest remainder so the block below sums to exactly 1.
#
# Largest still omitted: BLR-MAA (1,508,372), HYD-MAA (1,459,042),
# BOM-CCU (1,309,042). Each is a further expansion; none changes the character
# of the index, because all three are metro trunk routes like the eight here.
# What WOULD change its character is a thin regional sector, where a single
# carrier sets the price and a sold-out day is common. That is a harder
# measurement problem and is named as such in METHODOLOGY.md section 7.

advance_windows:
  # weight_basis is recorded because these weights are an ASSUMPTION, not a
  # measurement. No public booking-lead-time distribution for India exists.
  # See METHODOLOGY.md section 3.5.
  - days: 1
    label: "T+1"
    weight: 0.20
    weight_basis: "equal-weight (assumption)"
  - days: 7
    label: "T+7"
    weight: 0.20
    weight_basis: "equal-weight (assumption)"
  - days: 15
    label: "T+15"
    weight: 0.20
    weight_basis: "equal-weight (assumption)"
  - days: 30
    label: "T+30"
    weight: 0.20
    weight_basis: "equal-weight (assumption)"
  - days: 45
    label: "T+45"
    weight: 0.20
    weight_basis: "equal-weight (assumption)"

# Alternative window-weight vectors used by the back-test sensitivity analysis.
window_weight_scenarios:
  equal:          [0.20, 0.20, 0.20, 0.20, 0.20]
  near_heavy:     [0.35, 0.25, 0.20, 0.12, 0.08]
  advance_heavy:  [0.08, 0.12, 0.20, 0.30, 0.30]

product_definition:
  cabin: ECONOMY
  stops: 0                 # non-stop only, so the product stays constant
  price_concept: "lowest available total fare, inclusive of taxes, UDF and statutory charges"
  passengers: 1
